<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"/>
    <link rel="stylesheet" href="global.css" />
    <title>Monthly Uptime</title>
  </head>
  <body>
    <header>
        <img src="assets/kuma.svg" width="40px" />
        <h1>Monthly Uptime Reports</h1>
    </header>

    <main>
      <details id="filter-controls" closed>
        <summary><h2 id="filter-h2">Filters</h2></summary>
        <section>
          <div id="date-filters">
            <h3>Date</h3>
            <p>Select the month and year that you'd like to view. Data starts in September 2025, and defaults to the last available month.</p>
            <label for="month-select">Month:</label>
            <select id="month-select"></select>
            <label for="year-select">Year:</label>
            <select id="year-select"></select>
          </div>

          <h3>Monitors</h3>
          <p>Select the specific monitors you'd like to view.</p>
          <div id="name-filters"></div>
          <br>
          <!-- <button id="apply-filters">Apply Filters</button> -->
        </section>
      </details>

      <button id="standard-report-button" style="margin-top: 1rem;">Standard Monthly Report</button>

      <section>
        <h2 id="data-h2">Data (<span id="result-count">0</span> results)</h2>
        <label>
          <input type="checkbox" id="include-group-averages" checked>
          Include Group Averages in CSV Export
        </label>
        <br />
        <button id="download-csv" disabled>Download as CSV</button>
        <br />
        <div id="report-table-container"></div>
      </section>
    </main>
    
    <script src="scripts.js"></script>
  </body>
</html>
